name: PHP CS Fixer

on:
  pull_request:
  push:
    branches:
      - master
      - newComputer

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2

    - name: Install dependencies
      run: composer install --no-scripts --no-progress --no-interaction

    - name: Validate PHP Syntax
      run: find . -type f -name "*.php" ! -path "./vendor/*" -exec php -l {} \;

    - name: Run PHP CS Fixer (Check)
      if: github.event_name == 'pull_request'
      run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

    - name: Run PHP CS Fixer (Fix)
      if: github.event_name == 'push'
      run: vendor/bin/php-cs-fixer fix

    - name: Apply PHP CS Fixer coding standards
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Apply PHP CS Fixer coding standards" || echo "No changes to commit"
        git push https://$GH_PAT@github.com/roshanbhusal1020/Habit-Tracker.git HEAD
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
